<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
<div class="container">
  <header>
    <h1>Expense <span>Tracker</span></h1>
    <div class="badge" id="headerTotal">Total: $0.00</div>
  </header>
  <div class="card">
    <h2 id="formTitle">Add Expense</h2>
    <div class="grid3">
      <div class="field">
        <label>Expense Name</label>
        <input type="text" id="expName" placeholder="e.g. Pizza, Flight..."/>
      </div>
      <div class="field">
        <label>Amount ($)</label>
        <input type="number" id="expAmount" placeholder="0.00" min="0" step="0.01"/>
      </div>
      <div class="field">
        <label>Category</label>
        <select id="expCategory">
          <option value="Food">Food</option>
          <option value="Travel">Travel</option>
          <option value="Shopping">Shopping</option>
        </select>
      </div>
    </div>
    <div class="btn-row">
      <button class="btn-add"    id="btnAdd"    onclick="addExpense()">+ Add Expense</button>
      <button class="btn-update" id="btnUpdate" onclick="updateExpense()" disabled>↻ Update Expense</button>
      <button class="btn-cancel" id="btnCancel" onclick="cancelEdit()" style="display:none">✕ Cancel</button>
    </div>
  </div>
  <div class="grid3 stats">
    <div class="stat-card"><div class="dot food"></div><small>Food</small><b id="statFood">$0</b></div>
    <div class="stat-card"><div class="dot travel"></div><small>Travel</small><b id="statTravel">$0</b></div>
    <div class="stat-card"><div class="dot shop"></div><small>Shopping</small><b id="statShopping">$0</b></div>
  </div>

  <div class="list-header">
    <h2>All Expenses</h2>
    <span class="count" id="countBadge">0 items</span>
  </div>
  <div id="expenseList"></div>

  <div class="total-row" id="totalRow" style="display:none">
    <span>Grand Total</span>
    <b id="grandTotal">$0.00</b>
  </div>

</div>
<div class="toast" id="toast"></div>
<script src="expense.js"></script>
</body>
</html>
